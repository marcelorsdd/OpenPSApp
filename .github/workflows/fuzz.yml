name: Fuzz

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per harness
        default: '300'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  payload-fuzz:
    name: Payload fuzzing
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev lld-18 python3 make
      - name: Fuzz
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
        run: make -C payload fuzz FUZZ_CXX=clang++-18 FUZZ_CC=clang-18 FUZZ_SECONDS="$FUZZ_SECONDS"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: payload/build/fuzz/artifacts/
          if-no-files-found: ignore
